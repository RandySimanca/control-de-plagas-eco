server {
    listen 80;
    server_name localhost;
    client_max_body_size 50M;

    # Usar el DNS de Docker para resolver nombres de servicios
    resolver 127.0.0.11 valid=30s;

    # ── Reverse proxy → backend (API) ─────────────────────────────────────────
    # El navegador llama a /api/... y Nginx lo reenvía a backend:3001/api/...
    # Esto elimina CORS y problemas de cookies cross-origin por completo.
    location /api/ {
        set $backend_upstream http://backend:3001;
        proxy_pass         $backend_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Soporte para conexiones keep-alive
        proxy_set_header   Connection        "";
        # Pasar headers para soporte de túneles
        proxy_pass_header  Authorization;
        proxy_pass_header  X-Tunnel-Skip-Anti-Phishing-Page;
        proxy_pass_header  ngrok-skip-browser-warning;
        # Configuración para pasar correctamente el cuerpo de las peticiones
        proxy_set_header   Content-Type      $content_type;
        proxy_set_header   Content-Length    $content_length;
        # Buffer de lectura para mejor manejo de POST
        proxy_request_buffering off;
    }

    # ── Reverse proxy → backend (archivos subidos / multer) ───────────────────
    location /uploads/ {
        set $backend_upstream http://backend:3001;
        proxy_pass         $backend_upstream/uploads/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        # Pasar headers para soporte de túneles
        proxy_pass_header  Authorization;
        proxy_pass_header  X-Tunnel-Skip-Anti-Phishing-Page;
        proxy_pass_header  ngrok-skip-browser-warning;
    }

    # ── Archivos estáticos del frontend (SPA) ─────────────────────────────────
    location / {
        root  /usr/share/nginx/html;
        index index.html index.htm;
        
        # Redirigir el enrutamiento a index.html para que React Router funcione
        try_files $uri $uri/ /index.html;
    }

    # Desactivar caché agresiva para index.html y sw.js para que las actualizaciones PWA lleguen
    location ~* \.(?:manifest|appcache|html?|xml|json)$ {
        root  /usr/share/nginx/html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location ~* \.(?:js|css)$ {
        root  /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public";
    }
    
    # Excepción para el Service Worker (nunca debe tener caché)
    location = /sw.js {
        root  /usr/share/nginx/html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }
}
