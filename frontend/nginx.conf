server {
    listen 80;
    server_name localhost;
    client_max_body_size 50M;

    # ── Reverse proxy → backend (API) ─────────────────────────────────────────
    # El navegador llama a /api/... y Nginx lo reenvía a backend:3001/api/...
    # Esto elimina CORS y problemas de cookies cross-origin por completo.
    location /api/ {
        proxy_pass         http://backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Soporte para conexiones keep-alive
        proxy_set_header   Connection        "";
    }

    # ── Reverse proxy → backend (archivos subidos / multer) ───────────────────
    location /uploads/ {
        proxy_pass         http://backend:3001/uploads/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ── Archivos estáticos del frontend (SPA) ─────────────────────────────────
    location / {
        root  /usr/share/nginx/html;
        index index.html index.htm;
        
        # Redirigir el enrutamiento a index.html para que React Router funcione
        try_files $uri $uri/ /index.html;
    }

    # Desactivar caché agresiva para index.html y sw.js para que las actualizaciones PWA lleguen
    location ~* \.(?:manifest|appcache|html?|xml|json)$ {
        root  /usr/share/nginx/html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location ~* \.(?:js|css)$ {
        root  /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public";
    }
    
    # Excepción para el Service Worker (nunca debe tener caché)
    location = /sw.js {
        root  /usr/share/nginx/html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }
}
