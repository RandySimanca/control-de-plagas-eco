version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: plagcontrol-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: ./backend
    container_name: plagcontrol-backend
    restart: always
    environment:
      - PORT=3001
      - NODE_ENV=production
      - FRONTEND_URL=http://localhost
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # El usuario "node" (uid 1000) dentro del contenedor necesita
      # permisos de escritura en este directorio del host.
      # Ejecuta una vez: mkdir -p backend/uploads && chmod 777 backend/uploads
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        # Ruta relativa: Nginx reenvía /api/ → backend:3001/api/
        # El navegador solo habla con un único origen (puerto 80), sin CORS.
        - VITE_API_URL=${VITE_API_URL:-/api}
    container_name: plagcontrol-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
